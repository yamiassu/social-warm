name: Scraper health

# Every two days: run the real content script against each supported site and check
# that gathering still finds well-formed posts. Sites change their markup without notice.
on:
  schedule:
    - cron: '0 6 */2 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    name: probe (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [x, reddit, linkedin, instagram, youtube]
    env:
      X_STATE: ${{ secrets.X_STATE }}
      LINKEDIN_STATE: ${{ secrets.LINKEDIN_STATE }}
      INSTAGRAM_STATE: ${{ secrets.INSTAGRAM_STATE }}
    steps:
      # login-only sites without a session secret are skipped before paying for a browser
      - name: Check this site can run
        id: gate
        run: |
          case "${{ matrix.platform }}" in
            x) v="$X_STATE" ;;
            linkedin) v="$LINKEDIN_STATE" ;;
            instagram) v="$INSTAGRAM_STATE" ;;
            *) v=public ;;
          esac
          if [ -n "$v" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=${{ matrix.platform }} skipped::needs a login session secret (see README → Scraper health)"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: steps.gate.outputs.run == 'true'

      - run: npm run build
        if: steps.gate.outputs.run == 'true'

      - name: Install browser (retried, downloads sometimes hang)
        if: steps.gate.outputs.run == 'true'
        run: |
          for i in 1 2 3; do
            timeout 240 npx playwright install --with-deps chromium && exit 0
            echo "install attempt $i failed or timed out"
          done
          exit 1

      - name: Probe ${{ matrix.platform }}
        if: steps.gate.outputs.run == 'true'
        run: node scripts/probe.mjs ${{ matrix.platform }}

      - name: Upload report
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.platform }}
          path: probe-results/
          if-no-files-found: ignore

      - name: Open or update the failure issue
        if: failure() && steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Scraper probe failing: ${{ matrix.platform }}"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="Run: $run_url"$'\n\n'"$(cat probe-results/${{ matrix.platform }}.md 2>/dev/null)"
          gh label create scraper-health --color d73a4a --description "Scraper selectors drifted" 2>/dev/null || true
          n=$(gh issue list --state open --label scraper-health --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "$title" --label scraper-health --body "$body"; fi

      - name: Close the issue once it passes again
        if: success() && steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$(jq -r .status probe-results/${{ matrix.platform }}.json)" = "passed" ] || exit 0 # blocked leaves an open issue alone
          title="Scraper probe failing: ${{ matrix.platform }}"
          n=$(gh issue list --state open --label scraper-health --search "\"$title\" in:title" --json number --jq '.[0].number')
          [ -z "$n" ] || gh issue close "$n" --comment "Probe passes again: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
